name: Test release with file assets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test asset files
        run: |
          mkdir -p /tmp/release-assets
          echo "binary content v1.0.0" > /tmp/release-assets/app-linux-amd64
          echo "checksum abc123" > /tmp/release-assets/checksums.txt

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v4.0.0-asset-test
          name: "Asset Upload Test Release"
          body: "Testing asset upload functionality."
          files: |
            /tmp/release-assets/app-linux-amd64
            /tmp/release-assets/checksums.txt

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.release.outcome }}
          URL: ${{ steps.release.outputs.url }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          ASSETS: ${{ steps.release.outputs.assets }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $RELEASE_ID"
          echo "assets: $ASSETS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            echo "PASS: release with assets created, url=$URL id=$RELEASE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
