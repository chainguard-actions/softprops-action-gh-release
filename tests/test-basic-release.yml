name: Test basic release inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.1-test
          name: Test Release v0.0.1
          body: "This is a test release body"
          draft: "true"
          prerelease: "false"
          make_latest: "false"
          generate_release_notes: "false"
          target_commitish: main
          repository: ${{ github.repository }}
          token: fake-token-for-testing
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to fake token, which is expected)"
          echo "PASS: inputs were accepted by the action"
