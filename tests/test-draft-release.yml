name: Test draft release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v2.0.0-draft-test
          name: "Draft Test Release"
          body: "This is a draft release for testing."
          draft: true

      - name: Assert draft release ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.release.outcome }}
          URL: ${{ steps.release.outputs.url }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $RELEASE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            echo "PASS: draft release created at $URL (id=$RELEASE_ID)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
