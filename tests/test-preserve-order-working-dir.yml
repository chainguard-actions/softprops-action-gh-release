name: Test preserve_order, working_directory, and fail_on_unmatched_files inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create release asset files
        run: |
          mkdir -p /tmp/release-assets
          echo "asset one" > /tmp/release-assets/asset1.txt
          echo "asset two" > /tmp/release-assets/asset2.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.1-test-preserve
          name: Test Preserve Order Release
          body: "Testing preserve_order and working_directory"
          preserve_order: "true"
          working_directory: /tmp/release-assets
          files: |
            asset1.txt
            asset2.txt
          fail_on_unmatched_files: "false"
          draft: "true"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
          ID: ${{ steps.action.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            echo "PASS: got url '$URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
