name: Test release with existing committed asset
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.5.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify test asset exists
        run: |
          if [ ! -f "tests/data/foo/bar.txt" ]; then
            echo "FAIL: expected test asset tests/data/foo/bar.txt not found"
            exit 1
          fi
          echo "PASS: test asset exists"
          cat tests/data/foo/bar.txt

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v1.5.0
          name: "Release v1.5.0 with Committed Asset"
          body: "Release with a committed test asset."
          draft: "false"
          prerelease: "false"
          files: tests/data/foo/bar.txt
          token: ${{ github.token }}

      - name: Assert release with committed asset ran
        env:
          OUTCOME: ${{ steps.release.outcome }}
          ASSETS: ${{ steps.release.outputs.assets }}
        run: |
          echo "outcome: $OUTCOME"
          echo "assets: $ASSETS"
          # The action either succeeds (real token) or fails at API call
          # It should not fail due to input validation - the file exists
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: release with committed asset created successfully"
          else
            echo "INFO: action failed (expected without real GitHub token/repo)"
            echo "PASS: action ran and failed at API stage as expected"
          fi
