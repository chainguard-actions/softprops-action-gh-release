name: Test file upload inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fixture files for upload and body
        run: |
          mkdir -p /tmp/release-assets
          echo "asset content" > /tmp/release-assets/asset.txt
          echo "Release notes from file" > /tmp/release-body.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.2-test
          files: |
            /tmp/release-assets/*.txt
          working_directory: /tmp/release-assets
          overwrite_files: "true"
          fail_on_unmatched_files: "false"
          preserve_order: "true"
          body_path: /tmp/release-body.md
          append_body: "false"
          discussion_category_name: ""
          token: fake-token-for-testing
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to fake token, which is expected)"
          echo "PASS: file upload inputs were accepted by the action"
