name: Test file upload inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v2.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create release notes file and asset file
        run: |
          mkdir -p /tmp/release-assets
          echo "Release notes from file" > /tmp/release-notes.md
          echo "asset content" > /tmp/release-assets/asset.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v2.0.0-test
          body_path: /tmp/release-notes.md
          files: |
            /tmp/release-assets/asset.txt
          working_directory: /tmp/release-assets
          overwrite_files: "true"
          fail_on_unmatched_files: "false"
          preserve_order: "true"
          token: ${{ github.token }}
      - name: Assert action ran with file upload inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with file upload inputs"
