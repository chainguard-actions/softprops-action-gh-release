name: Test discussion_category_name and target_commitish inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.0.1-test-discussion
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tag_name: v0.0.1-test-discussion
          name: "Test Discussion Release"
          body: "Release with discussion category and target commitish."
          discussion_category_name: "General"
          target_commitish: ${{ github.sha }}
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with discussion_category_name and target_commitish
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with discussion_category_name and target_commitish inputs"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
