name: Test prerelease
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0-beta.1
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v1.0.0-beta.1
          name: "Beta Release v1.0.0-beta.1"
          body: "This is a prerelease version."
          draft: "false"
          prerelease: "true"
          token: ${{ github.token }}

      - name: Assert prerelease ran
        env:
          OUTCOME: ${{ steps.release.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action either succeeds (real token) or fails at API call
          # It should not fail due to input validation for prerelease mode
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: prerelease created successfully"
          else
            echo "INFO: action failed (expected without real GitHub token/repo)"
            echo "PASS: action ran and failed at API stage as expected"
          fi
