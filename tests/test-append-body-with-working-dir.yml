name: Test append body with working directory and target commitish
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.0.1-append-test
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory with asset
        run: |
          mkdir -p /tmp/release-assets
          echo "asset content" > /tmp/release-assets/asset.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.1-append-test
          name: Append Body Test Release
          body: "Appended body content"
          append_body: "true"
          target_commitish: ${{ github.sha }}
          working_directory: /tmp/release-assets
          files: asset.txt
          draft: "true"
          token: ${{ github.token }}

      - name: Assert action was invoked with append_body, target_commitish, and working_directory inputs
        run: |
          # The action may fail due to missing GitHub API access in act,
          # but we verify the inputs were accepted (no input validation error)
          OUTCOME="${{ steps.action.outcome }}"
          echo "Action outcome: $OUTCOME"
          # If it failed, check it wasn't due to unrecognized inputs
          if [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected in act without real GitHub token) - inputs were accepted"
          else
            echo "Action succeeded with append_body, target_commitish, and working_directory inputs"
          fi
          echo "PASS: inputs append_body, target_commitish, working_directory were accepted"
