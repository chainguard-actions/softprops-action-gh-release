name: Test release with file assets
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.1.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test asset files
        run: |
          mkdir -p /tmp/release-assets
          echo "binary content" > /tmp/release-assets/app-linux-amd64
          echo "archive content" > /tmp/release-assets/app-linux-amd64.tar.gz
          echo "checksum content" > /tmp/release-assets/checksums.txt

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v1.1.0
          name: "Release v1.1.0 with Assets"
          body: "Release with uploaded assets."
          draft: "false"
          prerelease: "false"
          files: |
            /tmp/release-assets/app-linux-amd64
            /tmp/release-assets/app-linux-amd64.tar.gz
            /tmp/release-assets/checksums.txt
          token: ${{ github.token }}

      - name: Assert release with files ran
        env:
          OUTCOME: ${{ steps.release.outcome }}
          ASSETS: ${{ steps.release.outputs.assets }}
        run: |
          echo "outcome: $OUTCOME"
          echo "assets: $ASSETS"
          # The action either succeeds (real token) or fails at API call
          # It should not fail due to input validation for file uploads
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: release with files created successfully"
            if [ -z "$ASSETS" ]; then
              echo "FAIL: expected non-empty assets output on success"
              exit 1
            fi
          else
            echo "INFO: action failed (expected without real GitHub token/repo)"
            echo "PASS: action ran and failed at API stage as expected"
          fi
