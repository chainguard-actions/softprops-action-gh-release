name: Test generate release notes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v5.0.0-notes-test
          name: "Auto Notes Test Release"
          generate_release_notes: "true"

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.release.outcome }}
          URL: ${{ steps.release.outputs.url }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $RELEASE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            echo "PASS: release with auto-generated notes created, url=$URL id=$RELEASE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
