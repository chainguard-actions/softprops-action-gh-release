name: Test generate release notes input validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.0.4-test
      GITHUB_REF_NAME: v0.0.4-test
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: softprops/action-gh-release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test: generate_release_notes=true with a valid tag in GITHUB_REF.
      # The action should pass validation (tag is present via GITHUB_REF).
      # It will attempt API call and may fail due to token/repo constraints in act,
      # but it must NOT fail with a configuration/validation error.
      - id: release
        uses: .
        with:
          tag_name: v0.0.4-test-autonotes
          name: "Test Auto-Generated Notes Release"
          draft: "true"
          prerelease: "false"
          generate_release_notes: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert action did not fail due to missing tag validation
        env:
          OUTCOME: ${{ steps.release.outcome }}
          URL: ${{ steps.release.outputs.url }}
          ID: ${{ steps.release.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            if [ -z "$ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            echo "PASS: release created with generate_release_notes=true"
          else
            echo "INFO: action failed (likely no real GitHub token/repo in act environment)"
            echo "PASS: action ran and failed at API call stage (not at validation stage)"
          fi

  # Separate job: test that missing tag without draft causes validation failure
  test-no-tag-validation:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_REF_NAME: main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: softprops/action-gh-release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: no_tag
        uses: .
        with:
          generate_release_notes: "true"
          draft: "false"
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Assert action failed with missing tag error
        env:
          OUTCOME: ${{ steps.no_tag.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no tag and not a draft"
            exit 1
          fi
          echo "PASS: action correctly failed when no tag provided"
