name: Test basic tag release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release body file
        run: echo "Test release body" > /tmp/release-body.txt

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "Test Release v1.0.0"
          body: "This is a test release created by act."
          draft: "false"
          prerelease: "false"
          token: ${{ github.token }}

      - name: Assert action ran (outputs or error)
        env:
          OUTCOME: ${{ steps.release.outcome }}
          URL: ${{ steps.release.outputs.url }}
          ID: ${{ steps.release.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $ID"
          # The action either succeeds (real token) or fails at API call
          # It should not fail due to input validation
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: release created successfully"
            if [ -z "$URL" ]; then
              echo "FAIL: expected non-empty url output on success"
              exit 1
            fi
            if [ -z "$ID" ]; then
              echo "FAIL: expected non-empty id output on success"
              exit 1
            fi
          else
            echo "INFO: action failed (expected without real GitHub token/repo)"
            echo "PASS: action ran and failed at API stage as expected"
          fi
