name: Test file upload options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v3.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test artifact
        run: |
          mkdir -p /tmp/release-assets
          echo "test artifact content" > /tmp/release-assets/artifact.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v3.0.0-test
          files: |
            artifact.txt
          working_directory: /tmp/release-assets
          fail_on_unmatched_files: false
          preserve_order: true
          overwrite_files: true
          token: ${{ github.token }}
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "assets: ${{ steps.action.outputs.assets }}"
          echo "PASS: action step executed with file upload inputs"
