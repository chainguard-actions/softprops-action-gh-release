name: Test file upload inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0-files
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test asset file
        run: |
          mkdir -p /tmp/release-assets
          echo "test asset content" > /tmp/release-assets/test-asset.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v1.0.0-files-test
          files: "test-asset.txt"
          working_directory: /tmp/release-assets
          fail_on_unmatched_files: "false"
          preserve_order: "true"
          overwrite_files: "true"
          token: ${{ github.token }}
      - name: Assert inputs were accepted
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "files, working_directory, fail_on_unmatched_files, preserve_order, overwrite_files inputs were passed successfully"
          echo "PASS: inputs accepted"
