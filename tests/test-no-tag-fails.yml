name: Test missing tag fails with clear error
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # No tag_name, GITHUB_REF is a branch (not a tag), and draft is unset, so
      # the action must hit its "GitHub Releases requires a tag" guard and fail
      # before making any GitHub API call. This is deterministic without a
      # writable target repo.
      - id: release
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF: refs/heads/main

      - name: Assert action failed because no tag was available
        env:
          OUTCOME: ${{ steps.release.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail when no tag is available, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no tag was provided"
