name: Test repository and discussion_category_name inputs are accepted
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test repository and discussion_category_name inputs.
      # We use fail_on_unmatched_files with a non-existent glob so the action
      # fails before making an API call, but AFTER parsing all inputs.
      # This confirms the inputs are recognized without needing a real release.
      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.0-actionchain-repo-test
          repository: ${{ github.repository }}
          discussion_category_name: "General"
          files: no-such-file-*.nonexistent
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action failed on unmatched files (not on input parsing)
        env:
          OUTCOME: ${{ steps.release.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on unmatched files, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: inputs repository and discussion_category_name were accepted; action failed on unmatched files as expected"
