name: Test target_commitish and preserve_order inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get current commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.1-target-commitish-test
          name: Target Commitish Test Release
          body: "Testing target_commitish and preserve_order inputs."
          target_commitish: ${{ steps.sha.outputs.sha }}
          preserve_order: "true"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
          ID: ${{ steps.action.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ] && [ -z "$ID" ]; then
              echo "FAIL: action succeeded but no outputs were set"
              exit 1
            fi
            echo "PASS: release created with url=$URL id=$ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
