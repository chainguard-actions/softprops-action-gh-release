name: Test discussion category input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v3.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          tag_name: v3.0.0-test
          name: "Test Discussion Release"
          body: "Release with discussion category"
          discussion_category_name: "General"
          draft: "true"
          prerelease: "true"
          make_latest: "false"
          generate_release_notes: "true"
          repository: ${{ github.repository }}
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert outputs exist
        env:
          STEP_OUTCOME: ${{ steps.action.outcome }}
          RELEASE_URL: ${{ steps.action.outputs.url }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
        run: |
          echo "step outcome: $STEP_OUTCOME"
          echo "release url: $RELEASE_URL"
          echo "release id: $RELEASE_ID"
          if [ "$STEP_OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_URL" ]; then
              echo "FAIL: expected non-empty url output"
              exit 1
            fi
            echo "PASS: release created with discussion_category_name input exercised"
          else
            echo "INFO: action did not succeed (may lack permissions in test env), but inputs were exercised"
          fi
