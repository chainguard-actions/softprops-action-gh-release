name: Test discussion category input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v3.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v3.0.0-test
          discussion_category_name: "General"
          token: ${{ github.token }}
      - name: Assert inputs were accepted
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "discussion_category_name input was passed successfully"
          echo "PASS: inputs accepted"
