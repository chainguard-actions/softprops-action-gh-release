name: Test working_directory, preserve_order, and fail_on_unmatched_files inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test assets in a working directory
        run: |
          mkdir -p /tmp/release-assets
          echo "asset content 1" > /tmp/release-assets/asset1.txt
          echo "asset content 2" > /tmp/release-assets/asset2.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.1-test-workdir
          name: Test Working Directory Release
          body: "Release with working_directory and preserve_order"
          files: "*.txt"
          working_directory: /tmp/release-assets
          preserve_order: "true"
          fail_on_unmatched_files: "true"
          token: ${{ github.token }}
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            echo "PASS: got url '$URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
