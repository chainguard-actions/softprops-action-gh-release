name: Test prerelease with body_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release notes file
        run: |
          echo "## Changelog" > /tmp/release-notes.md
          echo "- Feature A added" >> /tmp/release-notes.md
          echo "- Bug B fixed" >> /tmp/release-notes.md

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.9.0-prerelease-test
          name: "Pre-release Test v0.9.0"
          body_path: /tmp/release-notes.md
          prerelease: true

      - name: Assert prerelease ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.release.outcome }}
          URL: ${{ steps.release.outputs.url }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $RELEASE_ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            echo "PASS: prerelease created at $URL (id=$RELEASE_ID)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
