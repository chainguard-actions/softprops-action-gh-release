name: Test prerelease with body_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release notes file
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## What's Changed
          - Added new feature X
          - Fixed bug Y
          - Improved performance Z
          EOF

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v3.0.0-alpha.1
          name: "Pre-release v3.0.0-alpha.1"
          body_path: /tmp/release-notes.md
          prerelease: "true"

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.release.outcome }}
          URL: ${{ steps.release.outputs.url }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          UPLOAD_URL: ${{ steps.release.outputs.upload_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $RELEASE_ID"
          echo "upload_url: $UPLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but id output is empty"
              exit 1
            fi
            echo "PASS: prerelease created with url=$URL id=$RELEASE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
