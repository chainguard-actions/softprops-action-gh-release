name: Test fail_on_unmatched_files errors on missing files
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # tag_name satisfies the tag guard, so execution reaches the
      # unmatched-files check. The glob matches nothing and
      # fail_on_unmatched_files is true, so the action must fail before making
      # any release API call. Deterministic without a writable target repo.
      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.0-actionchain-test
          files: no-such-dir/**/*.nonexistent
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF: refs/heads/main

      - name: Assert action failed on unmatched files
        env:
          OUTCOME: ${{ steps.release.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on unmatched files, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on unmatched files before any API call"
