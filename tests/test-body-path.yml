name: Test release with body_path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create release notes file
        run: |
          cat > /tmp/RELEASE_NOTES.md << 'EOF'
          ## What's Changed

          - Feature A was added
          - Bug B was fixed
          - Performance improvements

          **Full Changelog**: https://github.com/example/repo/compare/v1.1.0...v1.2.0
          EOF

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v1.2.0
          name: "Release v1.2.0"
          body_path: /tmp/RELEASE_NOTES.md
          draft: "false"
          prerelease: "false"
          token: ${{ github.token }}

      - name: Assert body_path release ran
        env:
          OUTCOME: ${{ steps.release.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action either succeeds (real token) or fails at API call
          # It should not fail due to input validation for body_path
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: release with body_path created successfully"
          else
            echo "INFO: action failed (expected without real GitHub token/repo)"
            echo "PASS: action ran and failed at API stage as expected"
          fi
