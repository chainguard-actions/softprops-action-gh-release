name: Test body path and release notes inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v2.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v2.0.0-test
          body_path: ${{ github.workspace }}/actions/hardened/softprops--action-gh-release/v3.0.0/tests/fixtures/release-notes.md
          append_body: "false"
          generate_release_notes: "true"
          previous_tag: ""
          token: ${{ github.token }}
      - name: Assert inputs were accepted
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "body_path, append_body, generate_release_notes, previous_tag inputs were passed successfully"
          echo "PASS: inputs accepted"
