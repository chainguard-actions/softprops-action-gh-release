name: Test release notes and body options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v4.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create body file
        run: |
          echo "Release notes from file" > /tmp/release-notes.md
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v4.0.0-test
          body_path: /tmp/release-notes.md
          generate_release_notes: true
          append_body: false
          repository: ${{ github.repository }}
          discussion_category_name: ""
          token: ${{ github.token }}
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "url: ${{ steps.action.outputs.url }}"
          echo "PASS: action step executed with release notes inputs"
