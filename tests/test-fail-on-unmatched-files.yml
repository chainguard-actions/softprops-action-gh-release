name: Test fail_on_unmatched_files with no matching glob
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.5-test
          name: "Release with Unmatched Files"
          body: "Testing fail_on_unmatched_files."
          files: /tmp/nonexistent-file-*.zip
          fail_on_unmatched_files: "true"

      - name: Assert action failed due to unmatched files (or sentinel repo failure)
        env:
          OUTCOME: ${{ steps.release.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (unmatched files or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed due to unmatched files glob"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
