name: Test fail_on_unmatched_files and working_directory inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with asset file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          echo "test asset content" > "$GITHUB_WORKSPACE/release-assets/test-asset.txt"
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.1-unmatched-files-test
          name: Unmatched Files Test Release
          body: "Testing fail_on_unmatched_files and working_directory inputs."
          files: "test-asset.txt"
          working_directory: "${{ github.workspace }}/release-assets"
          fail_on_unmatched_files: "true"
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
          ID: ${{ steps.action.outputs.id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "id: $ID"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ] && [ -z "$ID" ]; then
              echo "FAIL: action succeeded but no outputs were set"
              exit 1
            fi
            echo "PASS: release created with url=$URL id=$ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
