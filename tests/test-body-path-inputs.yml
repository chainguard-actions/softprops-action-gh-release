name: Test body_path, append_body, working_directory, preserve_order, generate_release_notes inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a release notes file for body_path
      - name: Create release notes file
        run: |
          mkdir -p /tmp/release-assets
          echo "## Changelog" > /tmp/release-notes.md
          echo "- Feature A" >> /tmp/release-notes.md
          echo "- Bug fix B" >> /tmp/release-notes.md
          # Create a dummy asset file for working_directory test
          echo "asset content" > /tmp/release-assets/asset.txt

      # Test body_path, append_body, working_directory, preserve_order,
      # generate_release_notes inputs. We use fail_on_unmatched_files with a
      # non-existent glob so the action fails before making an API call, but
      # AFTER parsing all inputs. This confirms the inputs are recognized.
      - id: release
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.0-actionchain-bodypath-test
          body_path: /tmp/release-notes.md
          append_body: true
          working_directory: /tmp/release-assets
          files: no-such-file-*.nonexistent
          fail_on_unmatched_files: true
          preserve_order: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action failed on unmatched files (not on input parsing)
        env:
          OUTCOME: ${{ steps.release.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on unmatched files, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: inputs body_path, append_body, working_directory, preserve_order, generate_release_notes were accepted; action failed on unmatched files as expected"
