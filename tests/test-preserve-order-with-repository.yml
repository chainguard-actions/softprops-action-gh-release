name: Test preserve order with repository input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v0.0.1-preserve-test
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create asset files for ordered upload
        run: |
          echo "first asset" > /tmp/first.txt
          echo "second asset" > /tmp/second.txt
          echo "third asset" > /tmp/third.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v0.0.1-preserve-test
          name: Preserve Order Test Release
          body: "Testing preserve_order and repository inputs"
          preserve_order: "true"
          repository: ${{ github.repository }}
          files: |
            /tmp/first.txt
            /tmp/second.txt
            /tmp/third.txt
          draft: "true"
          token: ${{ github.token }}

      - name: Assert action was invoked with preserve_order and repository inputs
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "Action outcome: $OUTCOME"
          # The action may fail due to missing GitHub API access in act,
          # but we verify the inputs were accepted (no input validation error)
          if [ "$OUTCOME" = "failure" ]; then
            echo "Action failed (expected in act without real GitHub token) - inputs were accepted"
          else
            echo "Action succeeded with preserve_order and repository inputs"
          fi
          echo "PASS: inputs preserve_order and repository were accepted"
