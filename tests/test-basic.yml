name: Test basic release creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          tag_name: v1.0.0-test
          name: "Test Release v1.0.0"
          body: "This is a test release body."
          token: ${{ github.token }}
      - name: Assert action ran (outputs may be empty without real token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "url: ${{ steps.action.outputs.url }}"
          echo "id: ${{ steps.action.outputs.id }}"
          echo "PASS: action step executed"
